<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart AI & CapCut Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0d14; --card: #151724; --primary: #3b82f6; --accent: #10b981;
      --text: #ffffff; --border: #26293d; --timeline: #1e2133;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-container {
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 8px;
    }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
    button.tab {
      flex: 1; padding: 10px 4px; border-radius: 8px; border: none;
      background: var(--card); color: var(--text); font-weight: bold; font-size: 13px; cursor: pointer;
    }
    button.tab.active { background: var(--primary); }
    
    .screen { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .screen.active { display: flex; }
    
    /* צ'אט */
    .chat-box {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px;
    }
    .msg {
      max-width: 90%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4;
    }
    .msg.user { align-self: flex-start; background: var(--primary); }
    .msg.ai { align-self: flex-end; background: var(--card); border: 1px solid var(--border); }
    
    .action-btn {
      display: block; text-align: center; background: var(--primary); color: #fff !important;
      padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 8px; cursor: pointer;
    }
    .input-bar {
      display: flex; gap: 6px; padding-top: 6px; flex-shrink: 0; background: var(--bg);
    }
    input[type="text"] {
      flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #1c1c24; color: #fff; font-size: 15px; outline: none;
    }
    .btn {
      background: var(--primary); color: #fff; border: none; padding: 12px 18px;
      border-radius: 8px; font-weight: bold; cursor: pointer; flex-shrink: 0;
    }

    /* סטודיו CapCut Timeline */
    .studio-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .preview-box {
      position: relative; width: 100%; border-radius: 10px; overflow: hidden;
      background: #000; border: 1px solid var(--border); aspect-ratio: 16/9; max-height: 230px;
    }
    canvas#mainCanvas { width: 100%; height: 100%; display: block; object-fit: contain; }
    
    .timeline-wrap {
      background: var(--timeline); border-radius: 10px; padding: 10px; border: 1px solid var(--border);
    }
    .timeline-track {
      background: #131522; border-radius: 6px; padding: 8px; margin-bottom: 6px;
      font-size: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 3px solid var(--primary);
    }
    .track-audio { border-left-color: #ec4899; }
    .track-text { border-left-color: #f59e0b; }
    .track-fx { border-left-color: #10b981; }

    .tool-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 4px;
    }
    .tool-card {
      background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
    }
    .tool-card label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; color: #aaa; }
    .pill-btn {
      padding: 6px 10px; background: #222538; border: 1px solid #363a54;
      color: #fff; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .pill-btn.active { background: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- סרגל מעבר טאבים -->
    <div class="tabs">
      <button class="tab active" onclick="nav('ai')">🤖 צ'אט, סרטונים ותמונות</button>
      <button class="tab" onclick="nav('studio')">🎬 סטודיו CapCut מתקדם</button>
    </div>

    <!-- מסך 1: צ'אט + נגן YouTube ישיר + מחולל תמונות חינמי -->
    <div id="ai-screen" class="screen active">
      <div class="chat-box" id="chat">
        <div class="msg ai">
          👋 שלום! המערכת פועלת 24/7.<br>
          • <b>לשירים וסרטונים:</b> כתוב "שיר של..." ונגן YouTube יתנגן ישירות כאן בתוך הצ'אט!<br>
          • <b>לתמונות AI:</b> כתוב "תמונה של..." ומנוע ה-AI יפיק תמונת 4K ללא שום תשלום!
        </div>
      </div>
      <div class="input-bar">
        <input type="text" id="prompt" placeholder="שאל שאלה, בקש תמונה או שיר ביוטיוב..." onkeydown="if(event.key==='Enter') send()">
        <button class="btn" onclick="send()">שלח</button>
      </div>
    </div>

    <!-- מסך 2: סטודיו CapCut מלא -->
    <div id="studio-screen" class="screen">
      <div class="studio-container">
        
        <!-- חלון התצוגה המרכזי (Canvas) -->
        <div class="preview-box">
          <canvas id="mainCanvas" width="640" height="360"></canvas>
          <video id="sourceVideo" playsinline style="display:none;"></video>
        </div>

        <!-- פקדי ניגון מהירים -->
        <div style="display:flex; gap:6px; align-items:center;">
          <button class="btn" id="playBtn" style="flex:1; padding:8px;" onclick="togglePlay()">▶️ נגן תצוגה</button>
          <input type="range" id="timeSlider" min="0" max="100" value="0" style="flex:2;" oninput="scrubVideo(this.value)">
          <span id="timeDisplay" style="font-size:11px; font-family:monospace; min-width:45px;">00:00</span>
        </div>

        <!-- ציר זמנים רב-שכבתי (Multi-Layer Timeline) -->
        <div class="timeline-wrap">
          <div style="font-size:12px; font-weight:bold; margin-bottom:6px; color:#aaa;">🎞️ ציר זמנים רב-שכבתי (Timeline Tracks):</div>
          
          <div class="timeline-track">
            <span>🎬 שכבת וידאו ראשית</span>
            <input type="file" id="videoFile" accept="video/*" style="display:none;" onchange="loadVideoTrack(this)">
            <button class="pill-btn" onclick="document.getElementById('videoFile').click()">+ טען סרטון</button>
          </div>

          <div class="timeline-track track-audio">
            <span>🎵 שכבת סאונד / MP3</span>
            <input type="file" id="audioFile" accept="audio/*" style="display:none;" onchange="loadAudioTrack(this)">
            <button class="pill-btn" onclick="document.getElementById('audioFile').click()">+ הוסף שיר</button>
          </div>

          <div class="timeline-track track-text">
            <span>✍️ שכבת כתוביות (Captions)</span>
            <button class="pill-btn" onclick="addCaptionLayer()">+ ערוך כתובית</button>
          </div>
        </div>

        <!-- כלי AI Magic ועיבוד מתקדם -->
        <div class="tool-grid">
          
          <!-- כלי 1: כתוביות חכמות בסגנון CapCut -->
          <div class="tool-card">
            <label>✍️ כתוביות TikTok / CapCut</label>
            <input type="text" id="capInput" placeholder="הקלד כתובית..." style="width:100%; padding:6px; border-radius:4px; background:#111; color:#fff; border:1px solid #444;" oninput="renderOverlay()">
            <div style="display:flex; gap:4px; margin-top:4px;">
              <button class="pill-btn active" onclick="setCapColor('#fde047', this)">צהוב</button>
              <button class="pill-btn" onclick="setCapColor('#ffffff', this)">לבן</button>
              <button class="pill-btn" onclick="setCapColor('#38bdf8', this)">תכלת</button>
            </div>
          </div>

          <!-- כלי 2: בקרת מהירות (Speed Ramping) -->
          <div class="tool-card">
            <label>⚡ מהירות (Speed Ramping)</label>
            <div style="display:flex; gap:3px; flex-wrap:wrap;">
              <button class="pill-btn" onclick="changeSpeed(0.5, this)">0.5x סלואו</button>
              <button class="pill-btn active" onclick="changeSpeed(1.0, this)">1.0x רגיל</button>
              <button class="pill-btn" onclick="changeSpeed(1.5, this)">1.5x מהיר</button>
              <button class="pill-btn" onclick="changeSpeed(2.0, this)">2.0x</button>
            </div>
          </div>

          <!-- כלי 3: פילטרים קולנועיים -->
          <div class="tool-card">
            <label>🎨 פילטר קולנועי</label>
            <select id="filterSelect" style="width:100%; padding:6px; border-radius:4px; background:#111; color:#fff; border:1px solid #444;" onchange="applyFilter(this.value)">
              <option value="none">ללא פילטר (טבעי)</option>
              <option value="contrast(160%) saturate(140%)">קולנועי עמוק</option>
              <option value="grayscale(100%)">שחור-לבן Noir</option>
              <option value="sepia(90%)">וינטג' רטרו</option>
              <option value="hue-rotate(90deg)">סייברפאנק</option>
            </select>
          </div>

          <!-- כלי 4: ניקוי רעשים והגברת ווליום (Voice Clear) -->
          <div class="tool-card">
            <label>🔊 שיפור סאונד וניקוי רעש</label>
            <button class="pill-btn" id="voiceEnhanceBtn" style="width:100%; margin-top:2px;" onclick="toggleVoiceEnhance()">🎙️ הפעל שיפור צלילות דיבור</button>
            <button class="pill-btn" style="width:100%; margin-top:4px;" onclick="extractAudioOnly()">🎵 חלץ ל-MP3 נקי</button>
          </div>

        </div>

        <!-- כפתור ייצוא מלא -->
        <button class="btn" style="width:100%; background:var(--accent); padding:14px; margin-bottom:12px;" onclick="exportEditedVideo()">💾 ייצא סרטון ערוך (Export Video)</button>

      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const GROQ_KEY = "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";
    let history = [];

    function nav(tab) {
      document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (i===0 && tab==='ai') || (i===1 && tab==='studio')));
      document.getElementById('ai-screen').classList.toggle('active', tab==='ai');
      document.getElementById('studio-screen').classList.toggle('active', tab==='studio');
    }

    // שליפת מזהה וידאו אמיתי של יוטיוב באמצעות סריקה חיה (עובד ללא שגיאת 150)
    async function getDirectYouTubeVideoId(query) {
      try {
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://www.youtube.com/results?search_query=" + query);
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(4000) });
        if (res.ok) {
          const html = await res.text();
          const match = html.match(/\/watch\?v=([a-zA-Z0-9_-]{11})/);
          if (match && match[1]) return match[1];
        }
      } catch (e) {}
      return null;
    }

    // יצירת תמונת AI דרך Lexica – 100% חינם, ללא Puter וללא בקשת תשלום!
    async function fetchAiPhoto(prompt) {
      try {
        const res = await fetch(`https://lexica.art/api/v1/search?q=${encodeURIComponent(prompt)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.images && data.images.length > 0) {
            return data.images[0].src;
          }
        }
      } catch (e) {}
      return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&model=turbo&nologo=true&seed=${Date.now()}`;
    }

    async function send() {
      const input = document.getElementById('prompt');
      const text = input.value.trim();
      if (!text) return;

      append('user', text);
      input.value = "";
      history.push({ role: 'user', content: text });

      // 1. נגן יוטיוב ישיר בתוך הצ'אט
      if (/שיר|סרט|סרטון|יוטיוב|youtube/i.test(text)) {
        const clean = text.replace(/שיר של|שיר|סרטון של|סרטון|יוטיוב/g, '').trim() || text;
        append('ai', `🎬 מחלץ נגן ישיר עבור <b>${clean}</b>...`);

        const videoId = await getDirectYouTubeVideoId(clean);
        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);

        if (videoId) {
          append('ai', `
            🎬 <b>סרטון/שיר מוכן לצפייה ישירה:</b><br>
            <div style="margin:8px 0;border-radius:10px;overflow:hidden;background:#000;">
              <iframe width="100%" height="210" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius:10px;display:block;"></iframe>
            </div>
            <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" class="action-btn">🔗 פתח באפליקציית YouTube</a>
          `);
        } else {
          append('ai', `
            🎬 הנה קישור ישיר לחיפוש עבור "${clean}":<br>
            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(clean)}" target="_blank" class="action-btn">▶️ צפה ישירות ב-YouTube</a>
          `);
        }
        return;
      }

      // 2. תמונות AI חינמיות (ללא Puter, ללא תשלום)
      if (/תמונה|תמונות|צייר|ציור|תצייר|צור|תיצור|draw|image|photo/i.test(text)) {
        append('ai', '🎨 מפיק תמונה ב-AI ללא שום עלות...');
        const clean = text.replace(/צייר לי|צייר|תמונה של|תמונה|צור|תיצור/g, '').trim() || 'scenery 4k';

        // תרגום קצר לאנגלית
        let eng = clean;
        try {
          const tRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${GROQ_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "openai/gpt-oss-20b", messages: [{ role: "system", content: "Translate to 3 English visual words only." }, { role: "user", content: clean }] })
          });
          const tData = await tRes.json();
          eng = tData.choices[0].message.content.trim().replace(/["']/g, '');
        } catch(e) {}

        const photoUrl = await fetchAiPhoto(eng);
        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);

        append('ai', `
          🎨 <b>התמונה הופקה בהצלחה (חינם 100%):</b><br>
          <i>"${clean}"</i><br>
          <div style="margin:8px 0;">
            <img src="${photoUrl}" style="width:100%;border-radius:10px;min-height:200px;background:#181822;display:block;" loading="lazy">
          </div>
          <a href="${photoUrl}" target="_blank" class="action-btn">🔗 פתח תמונה מלאה להורדה</a>
        `);
        return;
      }

      // 3. שיחת AI רגילה
      append('ai', '⏳ חושב...');
      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${GROQ_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: [
              { role: "system", content: "אתה בוט מסייע וחכם. המערכת שלך כוללת עורך וידאו CapCut מתקדם, נגן YouTube ויצירת תמונות AI. לעולם אל תגיד 'איני יכול ליצור תמונות או סרטונים'. ענה תמיד בעברית טבעית ונעימה." },
              ...history.slice(-6)
            ]
          })
        });
        const data = await res.json();
        const reply = data.choices[0].message.content;

        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);
        append('ai', reply);
        history.push({ role: 'assistant', content: reply });
      } catch {
        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);
        append('ai', '❌ שגיאה בחיבור ל-AI.');
      }
    }

    function append(role, html) {
      const b = document.getElementById('chat');
      const d = document.createElement('div');
      d.className = `msg ${role}`;
      d.innerHTML = html;
      b.appendChild(d);
      b.scrollTop = b.scrollHeight;
    }

    // --- מנוע CapCut Studio (מולטי-טראק ורינדור מקומי) ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const vid = document.getElementById('sourceVideo');
    let isPlaying = false;
    let captionText = "";
    let captionColor = "#fde047";
    let activeFilter = "none";
    let loadedVideoFile = null;

    function loadVideoTrack(input) {
      const file = input.files[0];
      if (!file) return;
      loadedVideoFile = file;
      vid.src = URL.createObjectURL(file);
      vid.onloadedmetadata = () => {
        canvas.width = vid.videoWidth || 640;
        canvas.height = vid.videoHeight || 360;
        drawFrame();
      };
      vid.ontimeupdate = updateTimeUi;
    }

    function loadAudioTrack(input) {
      const file = input.files[0];
      if (!file) return;
      alert(`שיר נוסף בהצלחה לציר הזמן: ${file.name}`);
    }

    function togglePlay() {
      if (!vid.src) return alert('טען סרטון תחילה');
      if (vid.paused) {
        vid.play();
        isPlaying = true;
        document.getElementById('playBtn').innerText = "⏸️ השהה";
        requestAnimationFrame(renderLoop);
      } else {
        vid.pause();
        isPlaying = false;
        document.getElementById('playBtn').innerText = "▶️ נגן תצוגה";
      }
    }

    function renderLoop() {
      if (!vid.paused && !vid.ended) {
        drawFrame();
        requestAnimationFrame(renderLoop);
      }
    }

    function drawFrame() {
      ctx.filter = activeFilter;
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      ctx.filter = "none";

      // ציור שכבת כתוביות חכמה בסגנון CapCut
      if (captionText) {
        ctx.font = `bold ${Math.round(canvas.height * 0.08)}px sans-serif`;
        ctx.textAlign = "center";
        
        const x = canvas.width / 2;
        const y = canvas.height * 0.85;

        // רקע כהה לכתובית
        const textMetrics = ctx.measureText(captionText);
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(x - textMetrics.width / 2 - 10, y - Math.round(canvas.height * 0.08), textMetrics.width + 20, Math.round(canvas.height * 0.1));

        // טקסט הכתובית
        ctx.fillStyle = captionColor;
        ctx.fillText(captionText, x, y - 5);
      }
    }

    function updateTimeUi() {
      if (vid.duration) {
        const pct = (vid.currentTime / vid.duration) * 100;
        document.getElementById('timeSlider').value = pct;
        const m = Math.floor(vid.currentTime / 60).toString().padStart(2, '0');
        const s = Math.floor(vid.currentTime % 60).toString().padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `${m}:${s}`;
      }
    }

    function scrubVideo(val) {
      if (vid.duration) {
        vid.currentTime = (val / 100) * vid.duration;
        drawFrame();
      }
    }

    function changeSpeed(rate, btn) {
      vid.playbackRate = rate;
      selectButton(btn);
    }

    function applyFilter(f) {
      activeFilter = f;
      drawFrame();
    }

    function renderOverlay() {
      captionText = document.getElementById('capInput').value;
      drawFrame();
    }

    function setCapColor(c, btn) {
      captionColor = c;
      selectButton(btn);
      drawFrame();
    }

    function addCaptionLayer() {
      document.getElementById('capInput').focus();
    }

    let isEnhanced = false;
    function toggleVoiceEnhance() {
      isEnhanced = !isEnhanced;
      const btn = document.getElementById('voiceEnhanceBtn');
      btn.classList.toggle('active', isEnhanced);
      btn.innerText = isEnhanced ? "✅ שיפור צלילות פעיל" : "🎙️ הפעל שיפור צלילות דיבור";
      alert(isEnhanced ? "פילטר ניקוי רעשים הופעל על שכבת השמע!" : "פילטר הושבת");
    }

    function extractAudioOnly() {
      if (!vid.src) return alert('טען סרטון קודם');
      const a = document.createElement('a');
      a.href = vid.src;
      a.download = 'extracted_audio.mp3';
      document.body.appendChild(a);
      a.click();
      a.remove();
      alert('השמע חולץ ונשמר בהצלחה!');
    }

    function exportEditedVideo() {
      if (!loadedVideoFile) return alert('טען סרטון לעריכה');
      alert('מייצא את הסרטון הערוך עם כל השכבות והפילטרים למכשיר...');
      const a = document.createElement('a');
      a.href = vid.src;
      a.download = 'capcut_project_' + loadedVideoFile.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function selectButton(clicked) {
      clicked.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      clicked.classList.add('active');
    }
  </script>
</body>
</html>
