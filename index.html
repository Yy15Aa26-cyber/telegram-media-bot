<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart AI & Media Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --primary: #2563eb; --text: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .app-container {
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 10px;
    }
    .chat-box {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px;
    }
    .msg {
      max-width: 90%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4;
    }
    .msg.user { align-self: flex-start; background: var(--primary); }
    .msg.ai { align-self: flex-end; background: var(--card); border: 1px solid #333; }
    
    .action-btn {
      display: block; text-align: center; background: #2563eb; color: #fff !important;
      padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 8px; cursor: pointer;
    }
    .input-bar {
      display: flex; gap: 6px; padding-top: 6px; flex-shrink: 0; background: var(--bg);
    }
    input[type="text"] {
      flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444;
      background: #222; color: #fff; font-size: 15px; outline: none;
    }
    .btn {
      background: var(--primary); color: #fff; border: none; padding: 12px 18px;
      border-radius: 8px; font-weight: bold; cursor: pointer; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="chat-box" id="chat">
      <div class="msg ai">
        👋 שלום! המערכת פועלת 24/7 ללא הפסקה.<br>
        שאל אותי כל שאלה, בקש תמונה ב-AI, או חפש שירים וסרטונים מיוטיוב!
      </div>
    </div>
    <div class="input-bar">
      <input type="text" id="prompt" placeholder="שאל שאלה, בקש תמונה או שיר ביוטיוב..." onkeydown="if(event.key==='Enter') send()">
      <button class="btn" onclick="send()">שלח</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const GROQ_KEY = "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";
    let history = [];

    async function send() {
      const input = document.getElementById('prompt');
      const text = input.value.trim();
      if (!text) return;

      append('user', text);
      input.value = "";
      history.push({ role: 'user', content: text });

      // יצירת תמונות
      if (/צייר|ציור|תמונה|תמונות|draw/i.test(text)) {
        append('ai', '🎨 יוצר את התמונה...');
        const clean = text.replace(/צייר לי|צייר|תמונה של|תמונה/g, '').trim() || 'beautiful nature';
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(clean)}?width=640&height=640&nologo=true&seed=${Date.now()}`;
        
        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);
        append('ai', `
          🎨 <b>התמונה נוצרה:</b><br>
          <i>"${clean}"</i><br>
          <div style="margin:8px 0;"><img src="${imgUrl}" style="width:100%;border-radius:10px;min-height:200px;background:#222;" loading="lazy"></div>
          <a href="${imgUrl}" target="_blank" class="action-btn">🔗 פתח תמונה מלאה</a>
        `);
        return;
      }

      // חיפוש יוטיוב
      if (/שיר|סרט|יוטיוב|youtube/i.test(text)) {
        const clean = text.replace(/שיר של|שיר|סרט|יוטיוב/g, '').trim();
        append('ai', `
          🎬 הנה תוצאות עבור <b>${clean}</b>:<br>
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(clean)}" target="_blank" class="action-btn">▶️ צפה והאזן ב-YouTube</a>
        `);
        return;
      }

      // שיחת AI עם Groq
      append('ai', '⏳ חושב...');
      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: history.slice(-6)
          })
        });
        const data = await res.json();
        const reply = data.choices[0].message.content;

        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);
        append('ai', reply);
        history.push({ role: 'assistant', content: reply });
      } catch (err) {
        const box = document.getElementById('chat');
        box.removeChild(box.lastChild);
        append('ai', '❌ שגיאה בחיבור ל-AI.');
      }
    }

    function append(role, html) {
      const b = document.getElementById('chat');
      const d = document.createElement('div');
      d.className = `msg ${role}`;
      d.innerHTML = html;
      b.appendChild(d);
      b.scrollTop = b.scrollHeight;
    }
  </script>
</body>
</html>
